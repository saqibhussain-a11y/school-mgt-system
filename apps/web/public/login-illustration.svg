<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="55%" stop-color="#15294a" />
      <stop offset="100%" stop-color="#1f3d6b" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />

  <!-- soft glow accents -->
  <circle cx="150" cy="140" r="220" fill="#3987e5" opacity="0.12" />
  <circle cx="760" cy="1060" r="260" fill="#9085e9" opacity="0.14" />

  <!-- dashboard card -->
  <g transform="translate(150,300)">
    <rect x="0" y="0" width="600" height="360" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.15" />

    <!-- sidebar strip -->
    <rect x="24" y="28" width="80" height="304" rx="14" fill="#ffffff" opacity="0.08" />
    <circle cx="64" cy="70" r="14" fill="#3987e5" />
    <rect x="40" y="110" width="48" height="8" rx="4" fill="#ffffff" opacity="0.35" />
    <rect x="40" y="134" width="48" height="8" rx="4" fill="#ffffff" opacity="0.2" />
    <rect x="40" y="158" width="48" height="8" rx="4" fill="#ffffff" opacity="0.2" />
    <rect x="40" y="182" width="48" height="8" rx="4" fill="#ffffff" opacity="0.2" />

    <!-- bar chart -->
    <g transform="translate(140,60)">
      <rect x="0" y="140" width="34" height="80" rx="6" fill="#3987e5" opacity="0.85" />
      <rect x="48" y="100" width="34" height="120" rx="6" fill="#9085e9" opacity="0.85" />
      <rect x="96" y="60" width="34" height="160" rx="6" fill="#3987e5" opacity="0.55" />
      <rect x="144" y="120" width="34" height="100" rx="6" fill="#9085e9" opacity="0.55" />
      <rect x="192" y="40" width="34" height="180" rx="6" fill="#3987e5" opacity="0.4" />
    </g>

    <!-- checklist -->
    <g transform="translate(400,60)">
      <rect x="0" y="0" width="160" height="200" rx="14" fill="#ffffff" opacity="0.08" />
      <circle cx="24" cy="30" r="8" fill="#3987e5" />
      <rect x="42" y="24" width="98" height="10" rx="5" fill="#ffffff" opacity="0.4" />
      <circle cx="24" cy="66" r="8" fill="#9085e9" />
      <rect x="42" y="60" width="82" height="10" rx="5" fill="#ffffff" opacity="0.4" />
      <circle cx="24" cy="102" r="8" fill="#ffffff" opacity="0.25" />
      <rect x="42" y="96" width="90" height="10" rx="5" fill="#ffffff" opacity="0.25" />
      <circle cx="24" cy="138" r="8" fill="#ffffff" opacity="0.25" />
      <rect x="42" y="132" width="66" height="10" rx="5" fill="#ffffff" opacity="0.25" />
    </g>
  </g>

  <!-- graduation cap badge -->
  <g transform="translate(600,220)">
    <circle cx="0" cy="0" r="46" fill="#3987e5" />
    <path d="M-26 -6 L0 -20 L26 -6 L0 8 Z" fill="#ffffff" />
    <path d="M-26 -6 V16" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="-26" cy="18" r="4" fill="#ffffff" />
  </g>

  <!-- floating dots -->
  <circle cx="110" cy="720" r="6" fill="#ffffff" opacity="0.4" />
  <circle cx="760" cy="760" r="8" fill="#ffffff" opacity="0.3" />
  <circle cx="700" cy="920" r="5" fill="#ffffff" opacity="0.35" />
</svg>
